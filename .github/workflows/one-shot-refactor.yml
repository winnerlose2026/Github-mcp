name: One-shot refactor

# Throwaway automation for the server.py split. Running the refactor here rather
# than hand-editing 37 files keeps the change deterministic: the scripts were
# verified locally to reproduce the exact pre-refactor tool fingerprint, and this
# job re-checks that hash before it is allowed to commit anything.
#
# Scoped to this branch on purpose (workflow_dispatch would require the file to
# live on the default branch). Delete this workflow and scripts/_refactor/ once
# the split has landed.

on:
  push:
    branches: [refactor/split-server-into-domains]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Guard: the split is not idempotent (it reads tools out of server.py), so
      # skip everything if it has already been applied on this branch.
      - id: check
        name: Has the split already run?
        run: |
          if [ -f src/github_mcp/core.py ]; then
            echo "Already split; nothing to do."
            echo "todo=false" >> "$GITHUB_OUTPUT"
          else
            echo "todo=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.check.outputs.todo == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev dependencies
        if: steps.check.outputs.todo == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Record the pre-refactor tool fingerprint
        if: steps.check.outputs.todo == 'true'
        run: |
          python - <<'PY'
          import asyncio, hashlib, json
          from github_mcp import server
          tools = asyncio.run(server.mcp.list_tools())
          fp = {t.name: {"description": t.description, "schema": t.inputSchema}
                for t in tools}
          blob = json.dumps(fp, sort_keys=True, separators=(",", ":"))
          digest = hashlib.sha256(blob.encode()).hexdigest()
          print(f"before: {len(fp)} tools, sha256={digest}")
          open("/tmp/before.txt", "w").write(digest)
          PY

      - name: Split server.py into domain modules
        if: steps.check.outputs.todo == 'true'
        run: python scripts/_refactor/split_modules.py

      - name: Retarget the test suite
        if: steps.check.outputs.todo == 'true'
        run: python scripts/_refactor/split_tests.py

      # The throwaway scripts are excluded: they are deleted before this branch
      # is merged, so their own style is not worth gating on.
      - name: Format imports and lint
        if: steps.check.outputs.todo == 'true'
        run: |
          ruff check . --exclude scripts/_refactor --fix
          ruff check . --exclude scripts/_refactor

      - name: Run tests
        if: steps.check.outputs.todo == 'true'
        run: pytest -q

      - name: Launch the server and complete an MCP handshake
        if: steps.check.outputs.todo == 'true'
        run: python scripts/smoke_stdio.py --min-tools 100

      - name: Assert the tool surface did not change
        if: steps.check.outputs.todo == 'true'
        run: |
          python - <<'PY'
          import asyncio, hashlib, json, sys
          from github_mcp import core
          tools = asyncio.run(core.mcp.list_tools())
          fp = {t.name: {"description": t.description, "schema": t.inputSchema}
                for t in tools}
          blob = json.dumps(fp, sort_keys=True, separators=(",", ":"))
          after = hashlib.sha256(blob.encode()).hexdigest()
          before = open("/tmp/before.txt").read().strip()
          print(f"after:  {len(fp)} tools, sha256={after}")
          print(f"before: {before}")
          if after != before:
              sys.exit("tool surface changed - refusing to commit")
          print("tool surface identical - safe to commit")
          PY

      - name: Commit the refactor
        if: steps.check.outputs.todo == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -F - <<'MSG'
          Split server.py into domain modules

          Moves the FastMCP instance and session plumbing into core.py, the
          response summarizers into summaries.py, and every tool into a module
          named for its domain. Dissolves the extras.py and repo_admin.py junk
          drawers. server.py becomes the console entry point only.

          Performed by scripts/_refactor/, which this job verified reproduces the
          pre-refactor tool fingerprint byte for byte: 122 tools with identical
          names, descriptions, and input schemas.
          MSG
          git push
