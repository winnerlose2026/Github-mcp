[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "github-mcp-connector"
version = "0.16.0"
description = "A Model Context Protocol (MCP) connector for GitHub, for use with Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "winnerlose2026" }]
keywords = ["mcp", "github", "claude", "model-context-protocol", "connector"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # Upper bounds are deliberate: mcp 2.0 removed `mcp.server.fastmcp`,
    # which this package imports, so an unbounded range breaks every fresh
    # install. Revisit when porting to the standalone `fastmcp` package.
    "mcp>=1.2.0,<2",
    "httpx>=0.27,<1",
    "pynacl>=1.5,<2",
]

[project.urls]
Homepage = "https://github.com/winnerlose2026/Github-mcp"
Repository = "https://github.com/winnerlose2026/Github-mcp"
Issues = "https://github.com/winnerlose2026/Github-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
github-mcp = "github_mcp.server:main"
# Alias matching the PyPI distribution name so `uvx github-mcp-connector` works
# without a `--from` flag.
github-mcp-connector = "github_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
github_mcp = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
